services:
  mcui:
    container_name: test-mcui
    image: MusclePr/mcui:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    volumes:
      - "./server-1/data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    tty: true
    stdin_open: true
    environment:
      # OS
      TZ: "Asia/Tokyo"
      # RCON
      RCON_CONTAINER: yc2mc-server-1
      RCON_PASSWORD: "${PASSWORD:-AdminPassword}"
      RCON_PORT: 25575
      # user[0]
      MCUI_USERNAME: test
      MCUI_PASSWORD: test
      YC2MC_CONTAINER: yc2mc-server-1
      YC2MC_PORT: 8080
      YC2MC_URL: "localhost:8081"
      # user[1]
      MCUI_USERNAME_1: "test2"
      MCUI_PASSWORD_1: "test2"
      YC2MC_CONTAINER_1: yc2mc-server-1-2
      YC2MC_PORT_1: 8080
      YC2MC_URL_1: "localhost:8082"

  # Youtube
  yc2mc-2:
    container_name: yc2mc-server-1-2
    image: MusclePr/yc2mc:latest
    ports:
     - 8082:8080
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./server-1/data:/data:ro"
      - "./server-1/live2:/config"
    tty: true
    stdin_open: true
    environment:
      # OS
      TZ: "Asia/Tokyo"
      # YC2MC
      CHANNEL_URL: "https://www.youtube.com/@amami_rame"
      MC_YOUTUBE_NAME_COLOR: "gold"
      RCON_HOST: "mc-server-1"
      RCON_PASSWORD: "${RCON_PASSWORD:-AdminPassword}"
      RCON_PORT: 25575
      TICKET_SERVER: "ticket:8000"
      SETUP_ONLY: "${SETUP_ONLY:-false}"
    depends_on:
      - mc-server-1
      - ticket
    deploy:
      resources:
        limits:
          cpus: "0.25"

